apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
#  folder: linuxfabrik-monitoring-plugins
  name: LDAP
spec:
  schemaVersion: 2023041201
  tags:
    - vogtp
    - Grizzly
    - dynamic
  time:
    from: now-1d
    to: now
  timepicker:
    hidden: false
    refresh_intervals:
    - 1m
  timezone: browser
  title: LDAP
  uid: 293-ldap
  editable: true
  liveNow: true
  refresh: 1m
  templating:
    list:
    - label: Command
      name: command
      query: SHOW MEASUREMENTS WITH MEASUREMENT =~ /.*checkctl\-ldap.*/
      current:
        text: 293-cmd-check-checkctl-ldap
        value: 293-cmd-check-checkctl-ldap
      refresh: 1
      sort: 1
      type: query
    - label: Hostname
      name: hostname
      query: SHOW TAG VALUES FROM "$command" WITH KEY = "hostname"
      refresh: 1
      sort: 1
      type: query
    - label: Service
      name: service
      query: SHOW TAG VALUES FROM "$command" WITH KEY = "service" WHERE hostname = '$hostname'
      refresh: 1
      sort: 1
      type: query

  panels:

  - title: $service
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 0
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          lineInterpolation: smooth
          spanNulls: true
        min: 0
        unit: s
    options:
      legend:
        calcs:
        - lastNotNull
        - min
        - mean
        - max
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric  # "use value of tag (= indexed column) 'metric' for column names"
      refId: default
      groupBy:
      - params:
        - $__interval
        type: time
      - params:
        - metric
        type: tag
      - params:
        - 'null'
        type: fill
      measurement: $command
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
